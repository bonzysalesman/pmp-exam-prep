<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - PMP Exam Prep</title>
    <style>
        body { font-family: system-ui, sans-serif; text-align: center; padding: 2rem; background: #f8fafc; }
        .offline-container { max-width: 400px; margin: 0 auto; }
        .offline-icon { font-size: 4rem; margin-bottom: 1rem; }
        h1 { color: #374151; margin-bottom: 0.5rem; }
        p { color: #6b7280; margin-bottom: 2rem; }
        .btn { background: #2563eb; color: white; padding: 0.75rem 1.5rem; border: none; border-radius: 0.5rem; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📚</div>
        <h1>You're Offline</h1>
        <p>No internet connection. You can still access your downloaded lessons.</p>
        <a href="/" class="btn">View Cached Lessons</a>
    </div>
    
    <script>
        // Auto-redirect when back online
        window.addEventListener('online', () => {
            window.location.href = '/';
        });
    </script>
</body>
</html>
