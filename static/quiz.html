<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMP Exam Prep - Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-white shadow-sm border-b">
            <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
                <div class="flex items-center">
                    <img src="pmp-exam-prep-logo.png" alt="PMP Exam Prep" class="w-20 h-auto mr-4">
                    <h1 class="text-xl font-semibold text-gray-800">Integration Management Quiz</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-sm text-gray-600">Question 5 of 20</span>
                    <span class="text-sm font-medium text-blue-600">25:30 remaining</span>
                </div>
            </div>
        </header>

        <!-- Progress Bar -->
        <div class="bg-white border-b">
            <div class="max-w-7xl mx-auto px-6 py-2">
                <div class="w-full bg-gray-200 rounded-full h-2">
                    <div class="bg-blue-600 h-2 rounded-full" style="width: 25%"></div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <main class="max-w-4xl mx-auto p-6">
            <div class="bg-white rounded-lg shadow-lg">
                <div class="p-8">
                    <div class="mb-6">
                        <span class="inline-block bg-blue-100 text-blue-800 text-sm font-medium px-3 py-1 rounded-full mb-4">Question 5</span>
                        <h2 class="text-xl font-medium text-gray-900 leading-relaxed">
                            Which of the following is the BEST description of a project charter?
                        </h2>
                    </div>

                    <div class="space-y-4">
                        <label class="flex items-start p-4 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                            <input type="radio" name="answer" value="A" class="mt-1 mr-4">
                            <div>
                                <span class="font-medium text-gray-700">A.</span>
                                <span class="ml-2 text-gray-700">A document that formally authorizes the existence of a project and provides the project manager with the authority to apply organizational resources to project activities.</span>
                            </div>
                        </label>

                        <label class="flex items-start p-4 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                            <input type="radio" name="answer" value="B" class="mt-1 mr-4">
                            <div>
                                <span class="font-medium text-gray-700">B.</span>
                                <span class="ml-2 text-gray-700">A detailed project schedule that outlines all project activities and their dependencies.</span>
                            </div>
                        </label>

                        <label class="flex items-start p-4 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                            <input type="radio" name="answer" value="C" class="mt-1 mr-4">
                            <div>
                                <span class="font-medium text-gray-700">C.</span>
                                <span class="ml-2 text-gray-700">A comprehensive risk management plan that identifies all potential project risks.</span>
                            </div>
                        </label>

                        <label class="flex items-start p-4 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                            <input type="radio" name="answer" value="D" class="mt-1 mr-4">
                            <div>
                                <span class="font-medium text-gray-700">D.</span>
                                <span class="ml-2 text-gray-700">A budget allocation document that specifies how project funds will be distributed.</span>
                            </div>
                        </label>
                    </div>

                    <div class="flex justify-between items-center mt-8 pt-6 border-t">
                        <button class="px-6 py-2 text-gray-600 hover:text-gray-800 transition-colors">Previous</button>
                        <div class="flex space-x-3">
                            <button class="px-6 py-2 border border-gray-300 text-gray-700 rounded hover:bg-gray-50 transition-colors">Mark for Review</button>
                            <button class="px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors">Next Question</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Question Navigator -->
            <div class="mt-6 bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-medium text-gray-900 mb-4">Question Navigator</h3>
                <div class="grid grid-cols-10 gap-2">
                    <button class="w-8 h-8 bg-green-500 text-white text-sm rounded">1</button>
                    <button class="w-8 h-8 bg-green-500 text-white text-sm rounded">2</button>
                    <button class="w-8 h-8 bg-green-500 text-white text-sm rounded">3</button>
                    <button class="w-8 h-8 bg-green-500 text-white text-sm rounded">4</button>
                    <button class="w-8 h-8 bg-blue-600 text-white text-sm rounded">5</button>
                    <button class="w-8 h-8 bg-gray-200 text-gray-700 text-sm rounded">6</button>
                    <button class="w-8 h-8 bg-gray-200 text-gray-700 text-sm rounded">7</button>
                    <button class="w-8 h-8 bg-gray-200 text-gray-700 text-sm rounded">8</button>
                    <button class="w-8 h-8 bg-gray-200 text-gray-700 text-sm rounded">9</button>
                    <button class="w-8 h-8 bg-gray-200 text-gray-700 text-sm rounded">10</button>
                </div>
                <div class="flex items-center space-x-6 mt-4 text-sm">
                    <div class="flex items-center">
                        <div class="w-4 h-4 bg-green-500 rounded mr-2"></div>
                        <span class="text-gray-600">Answered</span>
                    </div>
                    <div class="flex items-center">
                        <div class="w-4 h-4 bg-blue-600 rounded mr-2"></div>
                        <span class="text-gray-600">Current</span>
                    </div>
                    <div class="flex items-center">
                        <div class="w-4 h-4 bg-gray-200 rounded mr-2"></div>
                        <span class="text-gray-600">Not answered</span>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
